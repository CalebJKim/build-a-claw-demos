#
# Example NemoClaw/OpenShell policy preset for the one-ask reading-list demo.
# Replace hostnames or paths with the real endpoints used by your environment.

preset:
  name: one-ask-research
  description: "Read-only education search plus sandbox-local publishing for the one-ask workflow demo"

network_policies:
  education_search:
    name: education_search
    endpoints:
      - host: www.fdic.gov
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.consumerfinance.gov
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.investor.gov
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.finra.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.khanacademy.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: www.bogleheads.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/wiki/**" }
      - host: www.irs.gov
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/retirement-plans/**" }
      - host: www.treasurydirect.gov
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/help-center/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  local_publish:
    name: local_publish
    endpoints: []
    filesystem:
      allow_write:
        - /sandbox/one-ask-workflow/output/**
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
